services:
  - type: web
    name: ai-resume-analyzer-api
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: NODE_VERSION
        value: 20

  - type: web
    name: ai-resume-analyzer-ui
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: ai-resume-analyzer-api
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
